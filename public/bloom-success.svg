<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <title>Bloom Success Icon</title>
  <defs>
    <linearGradient id="bloomGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F191A1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F191A1" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .petal {
      fill: url(#bloomGrad);
      transform-origin: 100px 100px;
      animation: openPetal 3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      opacity: 0;
    }
    
    .p1 { transform: rotate(0deg) scale(0); animation-delay: 0.1s; }
    .p2 { transform: rotate(72deg) scale(0); animation-delay: 0.2s; }
    .p3 { transform: rotate(144deg) scale(0); animation-delay: 0.3s; }
    .p4 { transform: rotate(216deg) scale(0); animation-delay: 0.4s; }
    .p5 { transform: rotate(288deg) scale(0); animation-delay: 0.5s; }

    @keyframes openPetal {
      0% { opacity: 0; }
      100% { opacity: 1; transform: scale(1.2) rotate(var(--rot)); }
    }
    
    .p1 { --rot: 0deg; }
    .p2 { --rot: 72deg; }
    .p3 { --rot: 144deg; }
    .p4 { --rot: 216deg; }
    .p5 { --rot: 288deg; }

    .check-path {
      fill: none;
      stroke: #ffffff;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 1s cubic-bezier(0.65, 0, 0.45, 1) forwards;
      animation-delay: 1.2s;
    }

    @keyframes drawCheck {
      100% { stroke-dashoffset: 0; }
    }

    .center-circle {
      fill: #F191A1;
      transform-origin: center;
      transform: scale(0);
      animation: popCircle 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      animation-delay: 0.8s;
      filter: url(#glow);
    }

    @keyframes popCircle {
      100% { transform: scale(1); }
    }

    .float {
      animation: gentleFloat 4s ease-in-out infinite alternate;
      transform-origin: center;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <g class="float">
    <!-- Ethereal Petals -->
    <path class="petal p1" d="M100 100 C 70 30, 130 30, 100 100" />
    <path class="petal p2" d="M100 100 C 70 30, 130 30, 100 100" />
    <path class="petal p3" d="M100 100 C 70 30, 130 30, 100 100" />
    <path class="petal p4" d="M100 100 C 70 30, 130 30, 100 100" />
    <path class="petal p5" d="M100 100 C 70 30, 130 30, 100 100" />

    <!-- Center Circle (Heart of the flower) -->
    <circle cx="100" cy="100" r="40" class="center-circle" />

    <!-- Elegant Checkmark -->
    <path class="check-path" d="M 82 102 L 95 115 L 120 85" />
  </g>
</svg>
